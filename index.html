<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>心不全トレーニング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#F2F4FA;
    --surface:#FFFFFF;
    --surface-2:#E7EAF6;
    --ink:#1C2340;
    --ink-soft:#565D80;
    --ink-faint:#5C6389;
    --line:#DCE1F2;
    --primary:#3B4EA8;
    --primary-strong:#262F72;
    --primary-tint:#E3E7F8;
    --accent:#954A18;
    --accent-tint:#FBE9DA;
    --good:#2E7D4F;
    --good-tint:#E4F3EA;
    --warn:#954A18;
    --warn-tint:#FBE9DA;
    --mark:#8A5A12;
    --mark-tint:#F3E7D3;
    --bad:#B23A3A;
    --bad-tint:#FBE7E5;
    --cat-acute:#3B4EA8;
    --cat-acute-tint:#E3E7F8;
    --cat-adjust:#6B4FA0;
    --cat-adjust-tint:#ECE6F7;
    --cat-chronic:#A24B3E;
    --cat-chronic-tint:#F7E7E3;
    --lab-high:#B23A3A;
    --lab-high-tint:#FBE7E5;
    --lab-low:#2A5599;
    --lab-low-tint:#E3EBF9;
    --shadow: 0 1px 2px rgba(19,26,52,.06), 0 6px 20px rgba(19,26,52,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10142A;
      --surface:#171C38;
      --surface-2:#1E2444;
      --ink:#E9ECFA;
      --ink-soft:#A7AECB;
      --ink-faint:#8089AE;
      --line:#2B3260;
      --primary:#8FA0FF;
      --primary-strong:#C1CBFF;
      --primary-tint:#232A54;
      --accent:#E3A45D;
      --accent-tint:#3A2A15;
      --good:#6FC796;
      --good-tint:#16301F;
      --warn:#E3A45D;
      --warn-tint:#3A2A15;
      --mark:#D9A54B;
      --mark-tint:#332510;
      --bad:#E27C7C;
      --bad-tint:#3A1B1B;
      --cat-acute:#8FA0FF;
      --cat-acute-tint:#232A54;
      --cat-adjust:#B79FE0;
      --cat-adjust-tint:#2C2440;
      --cat-chronic:#E08B77;
      --cat-chronic-tint:#3A241E;
      --lab-high:#E27C7C;
      --lab-high-tint:#3A1B1B;
      --lab-low:#8FB4E8;
      --lab-low-tint:#1D2C48;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10142A;
    --surface:#171C38;
    --surface-2:#1E2444;
    --ink:#E9ECFA;
    --ink-soft:#A7AECB;
    --ink-faint:#8089AE;
    --line:#2B3260;
    --primary:#8FA0FF;
    --primary-strong:#C1CBFF;
    --primary-tint:#232A54;
    --accent:#E3A45D;
    --accent-tint:#3A2A15;
    --good:#6FC796;
    --good-tint:#16301F;
    --warn:#E3A45D;
    --warn-tint:#3A2A15;
    --mark:#D9A54B;
    --mark-tint:#332510;
    --bad:#E27C7C;
    --bad-tint:#3A1B1B;
    --cat-acute:#8FA0FF;
    --cat-acute-tint:#232A54;
    --cat-adjust:#B79FE0;
    --cat-adjust-tint:#2C2440;
    --cat-chronic:#E08B77;
    --cat-chronic-tint:#3A241E;
    --lab-high:#E27C7C;
    --lab-high-tint:#3A1B1B;
    --lab-low:#8FB4E8;
    --lab-low-tint:#1D2C48;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.65;
  }
  h1,h2,h3,.disp{
    font-family:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
    text-wrap:balance;
    margin:0;
  }
  .mono{ font-family:"JetBrains Mono","Noto Sans JP",monospace; font-variant-numeric:tabular-nums; }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:14px 18px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar .back{
    appearance:none; border:none; background:transparent; color:var(--primary);
    font-size:15px; font-weight:700; cursor:pointer; padding:6px 8px 6px 0;
    display:flex; align-items:center; gap:2px; min-height:44px;
    font-family:inherit;
  }
  .topbar .title{
    font-size:15px; font-weight:700; color:var(--ink-soft);
    letter-spacing:.02em;
    flex:1;
    text-align:center;
    margin-right:34px;
  }
  main{flex:1; padding:0 18px 48px;}

  /* ---------- HOME ---------- */
  .hero{ padding:28px 4px 18px; }
  .hero .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:.14em; color:var(--primary);
    text-transform:uppercase;
  }
  .hero h1{ font-size:26px; font-weight:900; color:var(--ink); margin-top:8px; line-height:1.4; }
  .hero p{ color:var(--ink-soft); font-size:14px; margin-top:10px; max-width:44ch; }
  .hero .thesis{
    margin-top:14px; padding:13px 16px; border-radius:12px;
    background:var(--primary-tint); color:var(--primary-strong);
    font-size:13px; font-weight:700; line-height:1.7;
  }

  .progress-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin:16px 0 8px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:16px;
  }
  .progress-ring{ position:relative; width:56px; height:56px; flex:none;}
  .progress-ring svg{ transform:rotate(-90deg); }
  .progress-ring .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--primary-strong);
  }
  .progress-text{flex:1;}
  .progress-text .num{font-size:13px; font-weight:700; color:var(--ink);}
  .progress-text .sub{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
  .review-pill-btn{
    appearance:none; border:1px solid var(--warn); background:var(--warn-tint); color:var(--warn);
    font-weight:700; font-size:12.5px; padding:10px 14px; min-height:44px;
    display:inline-flex; align-items:center; border-radius:999px; cursor:pointer;
    white-space:nowrap; font-family:inherit;
  }
  .summary-cta{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--primary-tint); border:1px solid var(--primary); border-radius:16px;
    padding:14px 18px; margin:10px 0 24px; cursor:pointer;
    width:100%; text-align:left; font-family:inherit; appearance:none;
  }
  .summary-cta .t{display:block; font-size:14px; font-weight:700; color:var(--primary-strong);}
  .summary-cta .s{display:block; font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .summary-cta .arrow{color:var(--primary-strong); font-size:18px; flex:none;}

  .section-head{ display:flex; align-items:baseline; gap:8px; margin:26px 0 12px; }
  .section-head .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .section-head.acute .dot{background:var(--cat-acute);}
  .section-head.adjust .dot{background:var(--cat-adjust);}
  .section-head.chronic .dot{background:var(--cat-chronic);}
  .section-head h2{font-size:15px; font-weight:700; color:var(--ink);}
  .section-head .count{font-size:12px; color:var(--ink-faint); font-weight:400;}

  .case-grid{ display:flex; flex-direction:column; gap:10px; }
  .case-card{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 14px; cursor:pointer; text-align:left; width:100%;
    box-shadow:var(--shadow); font-family:inherit;
    appearance:none;
  }
  .case-card:active{ transform:scale(.99); }
  .ion-badge{
    flex:none; width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:"Zen Kaku Gothic New",sans-serif; font-weight:900; font-size:13.5px;
  }
  .ion-badge.acute{ background:var(--cat-acute-tint); color:var(--cat-acute); }
  .ion-badge.adjust{ background:var(--cat-adjust-tint); color:var(--cat-adjust); }
  .ion-badge.chronic{ background:var(--cat-chronic-tint); color:var(--cat-chronic); }
  .case-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .case-body .hint{
    font-size:14px; font-weight:600; color:var(--ink); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .status-chip{
    flex:none; align-self:flex-start; font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px;
    white-space:nowrap;
  }
  .status-chip.none{ background:var(--surface-2); color:var(--ink-faint); }
  .status-chip.good{ background:var(--good-tint); color:var(--good); }
  .status-chip.partial{ background:var(--warn-tint); color:var(--warn); }
  .status-chip.poor{ background:var(--bad-tint); color:var(--bad); }

  .empty-review{ text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:14px; }

  /* ---------- CASE VIEW ---------- */
  .case-hero{ padding:22px 0 4px; }
  .case-hero .tag{ font-size:12px; font-weight:700; letter-spacing:.08em; }
  .case-hero .tag.acute{ color:var(--cat-acute); } .case-hero .tag.adjust{ color:var(--cat-adjust); } .case-hero .tag.chronic{ color:var(--cat-chronic); }
  .case-hero h1{ font-size:21px; font-weight:900; margin-top:8px; }

  .vignette{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:18px 20px; margin-top:16px; box-shadow:var(--shadow); font-size:15.5px; color:var(--ink);
  }
  .lab-strip{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:flex; flex-wrap:wrap; gap:7px; }
  .lab-chip{
    display:inline-flex; align-items:baseline; gap:5px; padding:5px 10px; border-radius:8px;
    font-size:12.5px; font-weight:600;
  }
  .lab-chip .k{ color:inherit; opacity:.75; font-weight:700; }
  .lab-chip .v{ font-family:"JetBrains Mono",monospace; font-weight:700; font-variant-numeric:tabular-nums; }
  .lab-chip .u{ font-size:10.5px; opacity:.7; }
  .lab-chip.high{ background:var(--lab-high-tint); color:var(--lab-high); }
  .lab-chip.low{ background:var(--lab-low-tint); color:var(--lab-low); }
  .lab-chip.normal{ background:var(--surface-2); color:var(--ink-soft); }
  .finding-line{ margin-top:10px; font-size:12.5px; color:var(--ink-soft); }
  .finding-line b{ color:var(--ink); font-weight:700; }

  .selfcheck-card, .answer-report{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:4px 20px 6px; margin-top:20px; box-shadow:var(--shadow);
  }
  .sc-row{ padding:16px 0; border-bottom:1px dashed var(--line); }
  .sc-row:last-child{ border-bottom:none; }
  .sc-row label{ display:flex; align-items:baseline; gap:8px; font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:9px; }
  .sc-row label .n{ color:var(--primary); flex:none; }
  .sc-row textarea{
    width:100%; min-height:54px; max-height:320px; overflow-y:auto; resize:vertical; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
    padding:10px 12px; font-family:inherit; font-size:14.5px; line-height:1.6;
  }
  .sc-row textarea:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  .sc-row textarea::placeholder{ color:var(--ink-faint); }

  .ar-row{ padding:16px 0; border-bottom:1px dashed var(--line); }
  .ar-row:last-child{ border-bottom:none; }
  .ar-row h3{ display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:700; margin-bottom:9px; }
  .ar-row .ico{
    width:23px;height:23px;border-radius:7px;flex:none; display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:900; color:#fff;
  }
  .ico.urgent{ background:var(--bad); }
  .ico.treat{ background:var(--primary-strong); }
  .ico.stop{ background:var(--warn); }
  .ico.rate{ background:var(--cat-adjust); }
  .ar-row ul{ margin:0; padding-left:19px; font-size:15.5px; color:var(--ink); }
  .ar-row li{ margin-bottom:6px; } .ar-row li:last-child{ margin-bottom:0; }

  .reveal-btn{
    width:100%; margin-top:22px; appearance:none; border:none; cursor:pointer;
    background:var(--primary); color:#fff; font-weight:700; font-size:15px;
    padding:15px; border-radius:14px; font-family:inherit;
    box-shadow:0 4px 14px rgba(59,78,168,.28);
  }
  .reveal-btn:active{ transform:scale(.99); }

  .answer-wrap{ margin-top:26px; }
  .diagnosis-reveal{
    background:var(--primary-tint); border:1.5px solid var(--primary); border-radius:16px;
    padding:18px 20px; margin-bottom:16px; text-align:center;
  }
  .diagnosis-reveal .dr-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--primary-strong); }
  .diagnosis-reveal .dr-title{
    font-family:"Zen Kaku Gothic New",sans-serif; font-size:20px; font-weight:900;
    margin-top:6px; color:var(--ink);
  }
  .diagnosis-reveal .dr-sub{ font-size:12.5px; margin-top:6px; color:var(--ink-soft); }

  .pitfall-block{
    background:var(--warn-tint); border:2px solid var(--warn); border-radius:16px;
    padding:18px 20px; margin-bottom:20px; box-shadow:0 4px 16px -6px rgba(149,74,24,.35);
  }
  .pitfall-block .pf-label{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--warn);
    margin-bottom:10px;
  }
  .pitfall-block .pf-mark{
    width:26px;height:26px;border-radius:50%;background:var(--warn);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex:none;
  }
  .pitfall-block p{ margin:0; font-size:15px; color:var(--ink); line-height:1.75; }

  .answer-wrap .divider{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .answer-wrap .divider .line{ flex:1; height:1px; background:var(--line); }
  .answer-wrap .divider span{ font-size:12px; font-weight:700; color:var(--ink-faint); letter-spacing:.08em;}

  mark{
    background:var(--mark-tint); color:var(--mark); padding:1px 5px; border-radius:5px;
    font-weight:700; box-decoration-break:clone; -webkit-box-decoration-break:clone;
  }

  .rx-block{
    background:var(--surface); border:1px solid var(--primary); border-radius:16px;
    padding:16px 18px; margin-top:20px; box-shadow:var(--shadow);
  }
  .rx-label{
    display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:700; color:var(--primary-strong); margin-bottom:8px;
  }
  .rx-mark{
    width:22px;height:22px;border-radius:7px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:none;
    font-family:"Zen Kaku Gothic New",sans-serif;
  }
  .rx-caveat{ margin:0 0 10px; font-size:12px; color:var(--ink-faint); line-height:1.6; }
  .rx-block ul{ margin:0; padding-left:18px; font-size:14.5px; color:var(--ink); line-height:1.7; }
  .rx-block li{ margin-bottom:8px; } .rx-block li:last-child{ margin-bottom:0; }
  .rx-block .mono{ font-size:.95em; }

  .pearl-block{
    background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin-top:20px;
  }
  .pearl-block .pb-label{ font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:8px; }
  .pearl-block ul{ margin:0; padding-left:18px; font-size:14.5px; color:var(--ink-soft); line-height:1.6; }
  .pearl-block li{ margin-bottom:6px; } .pearl-block li:last-child{ margin-bottom:0; }

  .refs-block{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); }
  .refs-block h4{ font-size:12px; font-weight:700; color:var(--ink-faint); letter-spacing:.06em; margin-bottom:8px; }
  .refs-block ol{ margin:0; padding-left:19px; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .refs-block li{ margin-bottom:7px; } .refs-block li:last-child{ margin-bottom:0; }
  .refs-block a{ color:var(--ink-soft); text-decoration:underline; text-underline-offset:2px; word-break:break-all; }
  .refs-block a:hover{ color:var(--primary); }

  .assess-block{ margin-top:26px; }
  .assess-block .q{ font-size:14px; font-weight:700; margin-bottom:12px; text-align:center; }
  .assess-row{ display:flex; gap:8px; }
  .assess-btn{
    flex:1; appearance:none; cursor:pointer; border-radius:12px; padding:13px 6px;
    font-family:inherit; font-size:12.5px; font-weight:700; line-height:1.4;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft);
  }
  .assess-btn.good{ border-color:var(--good); }
  .assess-btn.partial{ border-color:var(--warn); }
  .assess-btn.poor{ border-color:var(--bad); }
  .assess-btn.good.active{ background:var(--good); color:#fff; }
  .assess-btn.partial.active{ background:var(--warn); color:#fff; }
  .assess-btn.poor.active{ background:var(--bad); color:#fff; }
  .save-warning{
    margin-top:12px; padding:10px 14px; border-radius:10px;
    background:var(--bad-tint); color:var(--bad); font-size:12.5px; font-weight:600; line-height:1.5;
  }

  .after-assess{ margin-top:22px; display:flex; flex-direction:column; gap:10px; animation:fadein .3s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .nav-btn{ appearance:none; border:none; cursor:pointer; border-radius:12px; padding:14px; font-family:inherit; font-size:14.5px; font-weight:700; text-align:center; }
  .nav-btn.primary{ background:var(--primary); color:#fff; }
  .nav-btn.ghost{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }

  /* ---------- APPROACH (初動まとめ) VIEW ---------- */
  .approach-hero{ padding:24px 0 6px; }
  .approach-hero .eyebrow{ font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.1em; text-transform:uppercase;}
  .approach-hero h1{ font-size:22px; font-weight:900; margin-top:8px; }
  .approach-hero p{ font-size:13.5px; color:var(--ink-soft); margin-top:8px; }

  .goal-note{
    margin-top:18px; padding:16px 18px; border-radius:14px;
    background:var(--accent-tint); border:1.5px solid var(--accent);
  }
  .goal-note .gn-label{ font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--accent); text-transform:uppercase; }
  .goal-note .gn-body{ font-size:13.5px; color:var(--ink); margin-top:6px; line-height:1.7; }

  .flow{ margin-top:22px; position:relative; }
  .flow-step{ display:flex; gap:14px; position:relative; padding-bottom:22px; }
  .flow-step:last-child{ padding-bottom:0; }
  .flow-step .rail{ display:flex; flex-direction:column; align-items:center; flex:none; }
  .flow-step .node{
    width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px;
    font-family:"Zen Kaku Gothic New",sans-serif; flex:none; z-index:1;
  }
  .flow-step .stem{ width:2px; flex:1; background:var(--line); margin-top:2px; }
  .flow-step .content{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); margin-top:1px;}
  .flow-step .content h3{ font-size:14.5px; font-weight:700; }
  .flow-step .content p{ font-size:13px; color:var(--ink-soft); margin-top:5px; }

  .axis-section-title{ font-size:16px; font-weight:700; color:var(--ink); margin:32px 0 6px; }
  .axis-section-note{ font-size:13px; color:var(--ink-soft); margin:0 0 16px; }

  .axis-card{

  .axis-dot{ width:9px; height:9px; border-radius:50%; flex:none; background:var(--primary); }
  .axis-card.acute .axis-dot{ background:var(--cat-acute); }
  .axis-card.adjust .axis-dot{ background:var(--cat-adjust); }
  .axis-card.chronic .axis-dot{ background:var(--cat-chronic); }
  .axis-head h3{ font-size:15px; font-weight:700; color:var(--ink); }
  .axis-intro{ font-size:13.5px; color:var(--ink-soft); margin:0 0 12px; line-height:1.7; }
  .axis-steps{ margin:0 0 12px; padding-left:20px; display:flex; flex-direction:column; gap:11px; }
  .axis-steps li{ font-size:14px; line-height:1.75; }
  .axis-steps li b{ display:block; color:var(--ink); font-weight:700; margin-bottom:3px; }
  .axis-steps li span{ color:var(--ink-soft); }
  .axis-note{
    background:var(--surface-2); border-radius:10px; padding:11px 13px;
    font-size:13.5px; color:var(--ink); line-height:1.65; margin-bottom:9px;
  }
  .axis-refs{ font-size:11px; color:var(--ink-faint); }

  .approach-foot{
    margin-top:26px; padding:16px 18px; background:var(--primary-tint); border-radius:14px;
    font-size:13px; color:var(--primary-strong); text-align:center; font-weight:700;
  }

  .global-note{
    margin-top:20px; padding:16px 18px; border-radius:14px;
    background:var(--surface-2); border:1px solid var(--line);
  }
  .global-note .gl-label{ font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:6px; }
  .global-note p{ font-size:13px; color:var(--ink-soft); line-height:1.75; margin:0; }

  .disclaimer{ margin-top:30px; padding:14px 16px; font-size:11.5px; color:var(--ink-faint); line-height:1.7; border-top:1px solid var(--line); }

  a{color:var(--primary);}
  button:focus-visible, textarea:focus-visible, .case-card:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

  @media (max-width:380px){
    .assess-btn{ font-size:11px; padding:12px 3px; }
  }

  @media (hover:hover){
    .case-card:hover{ border-color:var(--primary); }
    .summary-cta:hover{ background:var(--primary-tint); filter:brightness(0.97); }

    .nav-btn.primary:hover{ filter:brightness(1.08); }
    .nav-btn.ghost:hover{ border-color:var(--primary); }
    .topbar .back:hover{ text-decoration:underline; }

      },
      rx:["<mark>ノルアドレナリン</mark>を0.05〜0.1γ(μg/kg/分)程度から開始し、平均動脈圧65mmHg以上を目標に漸増する。<mark>体液量を確保してもなお血圧が低い/ショックが続く場合の第一選択</mark>(JCS/JHFS 2025でIIa・B-R)","肺うっ血があり低心拍出・低灌流所見はあるが血圧の低下が著明でない場合は<mark>ドブタミン</mark>2〜5γから開始し、収縮力と心拍出量の改善を見ながら調整する(JCS/JHFS 2025でIIa・C-LD。頻脈・不整脈に注意)","薬物治療への反応が乏しい場合はIABP、Impella、V-A ECMOなど機械的循環補助を早期に循環器専門医・心臓外科と相談する","心筋梗塞後の心原性ショックでは緊急冠動脈造影・再血行再建の適応を並行して評価する"],

    html += '</div>';

    html += '<div class="progress-card">';
    html += '  <div class="progress-ring"><svg width="56" height="56"><circle cx="28" cy="28" r="24" stroke="var(--surface-2)" stroke-width="5" fill="none"/><circle cx="28" cy="28" r="24" stroke="var(--primary)" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'"/></svg><div class="pct">'+pct+'%</div></div>';
    html += '  <div class="progress-text"><div class="num">'+mastered+' / '+total+' 症例 自力で言えた</div><div class="sub">'+subLine+'</div></div>';
    if(rev.length){
      html += '  <button class="review-pill-btn" data-action="toggle-review">復習</button>';
    }
    html += '</div>';

    html += '<button class="summary-cta" data-action="goto-approach"><span><span class="t">心不全の初動まとめ</span><span class="s">病態評価→治療選択→増悪因子→慢性期・退院</span></span><span class="arrow">›</span></button>';

    if(state.reviewOnly){
      html += '<div class="section-head"><span class="dot" style="background:var(--warn)"></span><h2>復習対象の症例</h2><span class="count">'+rev.length+'件</span></div>';
      if(rev.length===0){
        html += '<div class="empty-review">復習対象の症例はありません。<br>「一覧」から症例を確認できます。</div>';
      } else {
        html += '<div class="case-grid">'+rev.map(caseCardHtml).join("")+'</div>';
      }
    } else {
      ["acute","adjust","chronic"].forEach(function(cat){
        var list = CASES.filter(function(c){ return c.cat===cat; });
        html += '<div class="section-head '+cat+'"><span class="dot"></span><h2>'+CAT_LABEL[cat]+'</h2><span class="count">'+list.length+'症例</span></div>';
        html += '<div class="case-grid">'+list.map(caseCardHtml).join("")+'</div>';
      });
    }

    return html;
  }

  function caseCardHtml(c){
    var status = safeStatus(state.progress[c.id]);
    var cat = safeCat(c.cat);
    var numStr = (c.num<10?"0":"")+c.num;
    return '<button class="case-card" data-action="open-case" data-id="'+c.id+'">'+
      '<span class="ion-badge '+cat+'">'+CAT_BADGE[cat]+'</span>'+
      '<span class="case-body"><span class="hint">'+numStr+'　'+c.hint+'</span></span>'+
      '<span class="status-chip '+status+'">'+statusLabel(status)+'</span>'+
    '</button>';
  }

  /* ---------------- RENDER: CASE ---------------- */
  var revealCache = {};
  var draftCache = loadDrafts();
  var pendingStatus = {};

  function labChipHtml(l){
    var abn = (l.abn==="high"||l.abn==="low") ? l.abn : "normal";
    var symbol = abn==="high" ? "▲" : (abn==="low" ? "▼" : "");
    return '<span class="lab-chip '+abn+'"><span class="k">'+escapeHtml(l.k)+'</span><span class="v mono">'+(symbol?symbol+" ":"")+escapeHtml(l.v)+'</span>'+(l.u?'<span class="u">'+escapeHtml(l.u)+'</span>':'')+'</span>';
  }

  function renderCase(c){
    var cat = safeCat(c.cat);
    var html = "";
    html += '<div class="case-hero"><div class="tag '+cat+'">症例 '+(c.num<10?"0":"")+c.num+'・'+c.tag+'</div><h1>'+c.hint+'</h1></div>';
    html += '<div class="vignette">'+c.vignette;
    html += '<div class="lab-strip">'+c.labs.map(labChipHtml).join("")+'</div>';
    if(c.finding){ html += '<div class="finding-line"><b>所見　</b>'+escapeHtml(c.finding)+'</div>'; }
    html += '</div>';

    var revealed = !!revealCache[c.id];
    var drafts = draftCache[c.id] || {};

    html += '<div class="selfcheck-card" id="prompts">';
    PROMPTS.forEach(function(p){
      html += '<div class="sc-row">';
      html += '<label><span class="n">'+p.num+'</span>'+p.label+'</label>';
      html += '<textarea data-field="'+p.key+'" placeholder="'+p.ph+'">'+ (drafts[p.key] ? escapeHtml(drafts[p.key]) : "") +'</textarea>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="save-warning" id="draftSaveWarning" hidden>⚠ この端末に下書きを保存できませんでした。プライベートブラウズ中か、ストレージが無効になっている可能性があります。この画面を離れると記述内容が失われます。</div>';

    if(!revealed){
      html += '<button class="reveal-btn" data-action="reveal">模範解答を見る</button>';
    } else {
      html += renderAnswer(c);
    }

    return html;
  }

  function renderAnswer(c){
    var catLabel = CAT_LABEL[safeCat(c.cat)];
    var html = '<div class="answer-wrap">';
    html += '<div class="diagnosis-reveal"><div class="dr-eyebrow">病態</div><div class="dr-title">'+c.title+'</div><div class="dr-sub">'+catLabel+'</div></div>';

    html += '<div class="pitfall-block"><div class="pf-label"><span class="pf-mark">!</span>ありがちな誤対応</div><p>'+c.pitfall+'</p></div>';

    html += '<div class="divider"><div class="line"></div><span>模範解答</span><div class="line"></div></div>';

    html += '<div class="answer-report">';
    PROMPTS.forEach(function(p){
      html += answerRowHtml(p.key, p.label, c.answer[p.key]);
    });
    html += '</div>';

    html += renderRx(c);
    html += renderPearl(c);
    html += renderRefs(c);

    html += '</div>';

    html += '<div class="assess-block">';
    html += '<div class="q">自分の答えと照らし合わせて、自己評価しましょう</div>';
    var curRaw = pendingStatus[c.id] || state.progress[c.id] || "";
    var cur = VALID_STATUSES.indexOf(curRaw) !== -1 ? curRaw : "";
    html += '<div class="assess-row">';
    html += assessBtn("good","自力で言えた", cur);
    html += assessBtn("partial","一部抜けた", cur);
    html += assessBtn("poor","ほぼ言えなかった", cur);
    html += '</div>';
    if(cur && lastSaveFailed){
      html += '<div class="save-warning">⚠ この端末には保存できませんでした。プライベートブラウズ中か、ストレージが無効になっている可能性があります。この記録はこの画面を離れると失われます。</div>';
    }
    html += '</div>';

    if(cur){
      html += '<div class="after-assess">';
      html += '<button class="nav-btn primary" data-action="next-case">次の症例へ</button>';
      html += '<button class="nav-btn ghost" data-action="goto-home">一覧に戻る</button>';
      html += '</div>';
    }

    return html;
  }

  function answerRowHtml(key, label, items){
    return '<div class="ar-row"><h3><span class="ico '+key+'">'+ICO[key]+'</span>'+label+'</h3>'+
      '<ul>'+items.map(function(t){return '<li>'+t+'</li>';}).join("")+'</ul></div>';
  }

  function renderRx(c){
    if(!c.rx || !c.rx.length) return "";
    var items = c.rx.map(function(t){ return '<li>'+t+'</li>'; }).join("");
    return '<div class="rx-block"><div class="rx-label"><span class="rx-mark">℞</span>具体的な処方例</div>'+
      '<p class="rx-caveat">年齢・腎機能・心機能・体重により個別調整が必要な目安です。実際の投与量・速度は必ず添付文書・自施設のプロトコル・指導医で確認してください。</p>'+
      '<ul>'+items+'</ul></div>';
  }

  function renderPearl(c){
    if(!c.pearl || !c.pearl.length) return "";
    var items = c.pearl.map(function(t){ return '<li>'+t+'</li>'; }).join("");
    return '<div class="pearl-block"><div class="pb-label">まとめ</div><ul>'+items+'</ul></div>';
  }

  function renderRefs(c){
    if(!c.refs || !c.refs.length) return "";
    var items = c.refs.map(refEntryHtml).join("");
    return '<div class="refs-block"><h4>参考</h4><ol>'+items+'</ol></div>';
  }

  function refEntryHtml(r){
    var citationParts = [];
    if(r.author) citationParts.push(escapeHtml(r.author));
    if(r.title) citationParts.push(escapeHtml(r.title));
    var pub = [];
    if(r.source) pub.push(escapeHtml(r.source));
    if(r.year) pub.push(escapeHtml(String(r.year)));
    if(pub.length) citationParts.push(pub.join(" "));
    var text = citationParts.join("．");
    var linkHtml = "";
    if(r.url){
      linkHtml = '<br><a href="'+escapeHtml(r.url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(r.url)+'</a>';
    }
    return '<li>'+text+linkHtml+'</li>';
  }

  function assessBtn(kind, label, cur){
    return '<button class="assess-btn '+kind+(cur===kind?' active':'')+'" data-action="assess" data-kind="'+kind+'">'+label+'</button>';
  }

  /* ---------------- RENDER: APPROACH (初動まとめ) ---------------- */
  function renderApproach(){
    var html = "";
    html += '<div class="approach-hero"><div class="eyebrow">心不全の初動まとめ</div><h1>初動を守る2つの武器</h1><p>心不全はEFも背景疾患も多様で、丸暗記では対応しきれない。<mark>①症例によらず必ず自問する4つの問い</mark>と、<mark>②病態を整理する3つの型(急性期・診断分類・慢性期)</mark>、この2つを持っておくと、初めて見る症例でも初動を組み立てられる。</p></div>';
    html += '<div class="goal-note"><div class="gn-label">⚡ このアプリのゴール</div><div class="gn-body">「診断名を当てる」ことではありません。<mark>うっ血と低灌流を見分け、心不全治療と増悪因子治療の両方をセットで行い、初動(病態評価・治療選択・薬剤の見直し・モニタリング)を間違えない</mark>ことがゴールです。</div></div>';

    html += '<h2 class="axis-section-title">①症例によらず、まず自問する4つ</h2>';
    html += '<div class="flow">';
    FLOW.forEach(function(f,i){
      html += '<div class="flow-step">';
      html += '<div class="rail"><div class="node">'+(i+1)+'</div>'+(i<FLOW.length-1?'<div class="stem"></div>':'')+'</div>';
      html += '<div class="content"><h3>'+f.t+'</h3><p>'+f.d+'</p></div>';
      html += '</div>';
    });
    html += '</div>';

    html += '<h2 class="axis-section-title">②心不全を整理する3つの型</h2>';
    html += '<p class="axis-section-note">個別症例で学んだ知識を、初めて見る症例にも応用できる「型」に変換しておく。</p>';
    html += AXES.map(renderAxisCard).join('');

    html += '<div class="global-note"><div class="gl-label">海外ガイドラインとの違いに少しだけ触れると</div><p>2026年8月に公表されたESC(欧州心臓病学会)の心不全ガイドラインでは、HFmrEFという区分自体が撤廃され、LVEF 50%未満をHFrEFとして一括する2分類に戻る改訂が行われた。「急性心不全」という呼称も「非代償性心不全」に変更されるなど用語の整理も進んでいる。JCS/JHFS 2025年版は従来どおりHFrEF/HFmrEF/HFpEF/HFimpEFの4分類を維持しており、EFによる分類自体は国際的にもまだ議論の途上にある。ただし、うっ血を軸に初期対応を組み立てる考え方や、SGLT2阻害薬・MRA系薬剤をHFpEF/HFmrEFにも早期から用いる方向性など、大きな治療の方向性は共通している。</p></div>';

    html += '<div class="approach-foot">迷ったら、うっ血・低灌流・増悪因子・4本柱の4つに立ち返る。</div>';
    return html;
  }

  function renderAxisCard(ax){
    var html = '<div class="axis-card '+ax.cat+'">';
    html += '<div class="axis-head"><span class="axis-dot"></span><h3>'+ax.label+'</h3></div>';
    html += '<p class="axis-intro">'+ax.intro+'</p>';
    html += '<ol class="axis-steps">';
    ax.steps.forEach(function(s){
      html += '<li><b>'+s.t+'</b><span>'+s.d+'</span></li>';
    });
    html += '</ol>';
    html += '<div class="axis-note">'+ax.note+'</div>';
    html += '<div class="axis-refs">'+ax.refs.map(escapeHtml).join(' / ')+'</div>';
    html += '</div>';
    return html;
  }

  /* ---------------- MASTER RENDER ---------------- */
  function render(){
    var topbarHtml, mainHtml;

    if(state.view==="home"){
      topbarHtml = state.reviewOnly
        ? '<button class="back" data-action="goto-home-full">‹ 一覧</button><div class="title">復習リスト</div>'
        : '<div class="title">心不全トレーニング</div>';
      mainHtml = renderHome();
      if(!state.reviewOnly){
        mainHtml += '<div class="disclaimer">内容は教育目的の一般的な整理です。実際の治療方針は必ず各施設のプロトコルや指導医の判断、日本循環器学会(JCS)/日本心不全学会(JHFS)の最新ガイドラインに従ってください。</div>';
      }
    } else if(state.view==="case"){
      var c = caseById(state.caseId);
      if(!c){
        state.view = "home";
        state.caseId = null;
        return render();
      }
      var numStr = (c.num<10?"0":"")+c.num;
      topbarHtml = '<button class="back" data-action="goto-home">‹ 一覧</button><div class="title">症例 '+numStr+'</div>';
      mainHtml = renderCase(c);
    } else if(state.view==="approach"){
      topbarHtml = '<button class="back" data-action="goto-home">‹ 一覧</button><div class="title">初動まとめ</div>';
      mainHtml = renderApproach();
    }

    app.innerHTML = '<div class="topbar">'+topbarHtml+'</div><main>'+mainHtml+'</main>';
    bindEvents();
  }

  /* ---------------- EVENTS ---------------- */
  function nextInPool(pool, current){
    var idx = -1;
    for(var i=0;i<pool.length;i++){ if(pool[i].id===current.id){ idx = i; break; } }
    return idx === -1 ? pool[0] : pool[(idx+1) % pool.length];
  }

  function bindEvents(){
    app.querySelectorAll("[data-action]").forEach(function(el){
      el.addEventListener("click", function(){
        var action = el.getAttribute("data-action");
        if(action==="open-case"){
          revealCache[el.getAttribute("data-id")] = false;
          delete pendingStatus[el.getAttribute("data-id")];
          lastSaveFailed = false;
          go("case", el.getAttribute("data-id"));
        } else if(action==="goto-home"){
          go("home");
        } else if(action==="goto-home-full"){
          state.reviewOnly = false;
          render();
        } else if(action==="toggle-review"){
          state.reviewOnly = true;
          render();
        } else if(action==="goto-approach"){
          go("approach");
        } else if(action==="reveal"){
          lastSaveFailed = false;
          collectDraft(state.caseId, false);
          if(draftSaveTimer){ clearTimeout(draftSaveTimer); draftSaveTimer = null; }
          revealCache[state.caseId] = true;
          render();
          flushDraftSave();
          var wrap = app.querySelector(".answer-wrap");
          if(wrap) wrap.scrollIntoView({behavior:"smooth", block:"start"});
        } else if(action==="assess"){
          var kind = el.getAttribute("data-kind");
          var c0 = caseById(state.caseId);
          if(!c0) return;
          pendingStatus[state.caseId] = kind;
          state.progress[state.caseId] = kind;
          lastSaveFailed = !saveProgress(state.progress);
          render();
        } else if(action==="next-case"){
          var c = caseById(state.caseId);
          if(!c) return;
          var pool = state.reviewOnly ? reviewCases() : CASES;
          if(state.reviewOnly && pool.length === 0){
            state.reviewOnly = false;
            pool = CASES;
          }
          var next = nextInPool(pool, c);
          revealCache[next.id] = false;
          delete pendingStatus[next.id];
          lastSaveFailed = false;
          go("case", next.id);
        }
      });
    });

    app.querySelectorAll("textarea[data-field]").forEach(function(ta){
      ta.addEventListener("input", function(){
        collectDraft(state.caseId, false);
      });
    });
  }

  var draftSaveTimer = null;
  function flushDraftSave(){
    var ok = saveDrafts(draftCache);
    var warnEl = document.getElementById("draftSaveWarning");
    if(warnEl){ warnEl.hidden = ok; }
  }
  function collectDraft(caseId, flushNow){
    var d = {};
    app.querySelectorAll("textarea[data-field]").forEach(function(ta){
      d[ta.getAttribute("data-field")] = ta.value;
    });
    draftCache[caseId] = d;
    if(draftSaveTimer){ clearTimeout(draftSaveTimer); draftSaveTimer = null; }
    if(flushNow){
      flushDraftSave();
    } else {
      draftSaveTimer = setTimeout(flushDraftSave, 400);
    }
  }
  window.addEventListener("pagehide", function(){ saveDrafts(draftCache); });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") saveDrafts(draftCache);
  });

  render();
})();
</script>
</body>
</html>
